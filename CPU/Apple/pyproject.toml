[project]
name = "zoubiskel3d"
version = "0.1.0"
description = "3D skeletonization with a C++ backend"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy",
]

[project.urls]
Repository = "https://github.com/JyVi/ZoubedySkeleton/tree/main/CPU/Apple"
Homepage = "https://github.com/JyVi/ZoubedySkeleton"
Issues = "https://github.com/JyVi/ZoubedySkeleton/issues"

[dependency-groups]
dev = [
    "nibabel",
    "scikit-image",
]

[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=3.1",
    "cmake>=3.28",
    "ninja>=1.11",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/skeletonize3d"]
build-dir = "build/{wheel_tag}"
build.tool-args = ["-j0"]
sdist.inclusion-mode = "explicit"
sdist.include = [
    "pyproject.toml",
    "README.md",
    "LICENCE",
    "CMakeLists.txt",
    "include/skeletonize/**",
    "python/bindings.cc",
    "python/bindings.hpp",
    "python/skeletonize3d/**",
]
sdist.exclude = [
    "python/skeletonize3d/__pycache__/**",
    "python/skeletonize3d/*.so",
]

[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDINGS = "ON"
BUILD_SKELETONIZE_APP = "OFF"
SKELETONIZE_NATIVE_OPTIMIZATION = "OFF"
SKELETONIZE_FAST_MATH = "ON"
SKELETONIZE_USE_SYSTEM_TBB = "OFF"

[tool.scikit-build.env]
CMAKE_BUILD_PARALLEL_LEVEL = ""

[tool.cibuildwheel]
skip = "cp*-win*"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
