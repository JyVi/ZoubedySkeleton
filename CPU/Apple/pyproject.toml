[project]
name = "skeletonize3d"
version = "0.1.0"
description = "3D skeletonization with a C++ backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
]

[dependency-groups]
dev = [
    "nibabel",
    "scikit-image",
]

[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=3.1",
    "cmake>=3.28",
    "ninja>=1.11",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/skeletonize3d"]
build-dir = "build/{wheel_tag}"
build.tool-args = ["-j0"]
sdist.inclusion-mode = "explicit"
sdist.include = [
    "pyproject.toml",
    "README.md",
    "CMakeLists.txt",
    "include/skeletonize/**",
    "python/bindings.cc",
    "python/bindings.hpp",
    "python/skeletonize3d/**",
]
sdist.exclude = [
    "python/skeletonize3d/__pycache__/**",
    "python/skeletonize3d/*.so",
]

[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDINGS = "ON"
BUILD_SKELETONIZE_APP = "OFF"
SKELETONIZE_NATIVE_OPTIMIZATION = "ON"
SKELETONIZE_FAST_MATH = "OFF"

[tool.scikit-build.env]
CMAKE_BUILD_PARALLEL_LEVEL = ""
